version: "3.9"

services:
  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: finstack_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-finstack}
      POSTGRES_USER:     ${DB_USER:-finstack}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-finstack_secret_2026}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${DB_USER:-finstack} -d ${DB_NAME:-finstack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [finstack_net]

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finstack_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfilename "appendonly.aof"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","--no-auth-warning","-a","${REDIS_PASSWORD:-redis_secret_2026}","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [finstack_net]

  # ── Node.js API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: finstack_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV:     production
      PORT:         3001
      DB_HOST:      postgres
      REDIS_HOST:   redis
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [finstack_net]
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── BullMQ Workers ────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: finstack_worker
    restart: unless-stopped
    command: ["node","src/jobs/worker.js"]
    env_file: ./backend/.env
    environment:
      NODE_ENV:   production
      DB_HOST:    postgres
      REDIS_HOST: redis
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [finstack_net]

  # ── Nginx ─────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: finstack_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/out:/usr/share/nginx/html:ro
      - nginx_cache:/var/cache/nginx
      - api_uploads:/app/uploads:ro    # Shared with API for static file serving
    depends_on: [api]
    networks: [finstack_net]

volumes:
  postgres_data:
  redis_data:
  api_uploads:
  api_logs:
  nginx_cache:

networks:
  finstack_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
