user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept       on;
    use                epoll;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct=$upstream_connect_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # ── Performance ───────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # ── Compression ───────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   512;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml text/xml;

    # ── Buffers ───────────────────────────────────────────────────────────
    client_max_body_size       25m;
    client_body_buffer_size    128k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    proxy_buffering            on;
    proxy_buffers              16 32k;
    proxy_buffer_size          64k;

    # ── Rate limit zones ──────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=global:20m  rate=60r/m;
    limit_req_zone  $binary_remote_addr zone=auth:10m    rate=10r/m;
    limit_req_zone  $binary_remote_addr zone=upload:5m   rate=20r/h;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Proxy cache ───────────────────────────────────────────────────────
    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=api_cache:20m
        max_size=200m
        inactive=10m
        use_temp_path=off;

    # ── Upstream API ──────────────────────────────────────────────────────
    upstream finstack_api {
        least_conn;
        server api:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ── HTTPS Server ──────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name finstack.aviinjobs.com;

        # SSL
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"  always;
        add_header X-Content-Type-Options    "nosniff"     always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

        limit_conn perip 50;

        # Health (no rate limit, no cache)
        location = /health {
            proxy_pass         http://finstack_api;
            proxy_read_timeout 5s;
            access_log         off;
            proxy_set_header   Host $host;
        }

        # Auth endpoints — strict rate limit
        location ~ ^/api/v1/auth/(login|register|forgot-password) {
            limit_req  zone=auth burst=5 nodelay;
            limit_req_status 429;
            include    /etc/nginx/proxy_params;
            proxy_pass http://finstack_api;
        }

        # File upload — size + rate
        location /api/v1/upload {
            limit_req            zone=upload burst=2 nodelay;
            client_max_body_size 25m;
            proxy_read_timeout   120s;
            include              /etc/nginx/proxy_params;
            proxy_pass           http://finstack_api;
        }

        # API — general (with smart caching on GET)
        location /api/ {
            limit_req  zone=global burst=30 nodelay;

            # Cache safe GET responses for 60 seconds
            proxy_cache            api_cache;
            proxy_cache_methods    GET HEAD;
            proxy_cache_valid      200 60s;
            proxy_cache_key        "$scheme$host$request_uri$http_authorization";
            proxy_cache_bypass     $http_authorization $http_pragma;
            proxy_no_cache         $http_authorization $http_pragma;
            add_header             X-Cache-Status $upstream_cache_status always;

            include    /etc/nginx/proxy_params;
            proxy_pass http://finstack_api;
        }

        # Uploaded files (served directly)
        location /uploads/ {
            alias      /app/uploads/;
            expires    7d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            access_log off;
        }

        # Frontend SPA
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            try_files  $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
                expires     1y;
                add_header  Cache-Control "public, immutable";
                access_log  off;
            }
        }

        # Block common attack paths
        location ~ /\.(git|env|htaccess|DS_Store) { deny all; return 404; }
        location ~ /(wp-admin|wp-login|phpmyadmin|\.php$) { deny all; return 404; }
    }
}
